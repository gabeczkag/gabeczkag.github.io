<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekt</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>
</head>
<body>
  <div class="plasma-bg" aria-hidden="true">
    <div class="blob" style="width:520px;height:520px;background:#ff9a4d;top:-120px;left:-80px;animation-delay:-5s;"></div>
    <div class="blob" style="width:420px;height:420px;background:#ff7e5f;top:40%;right:-100px;animation-delay:-12s;"></div>
    <div class="blob" style="width:380px;height:380px;background:#ffd9b3;bottom:-80px;left:30%;animation-delay:-18s;"></div>
    <div class="blob" style="width:300px;height:300px;background:#ffb88c;top:20%;left:40%;animation-delay:-8s;"></div>
    <div class="blob" style="width:260px;height:260px;background:#ffe2d1;bottom:20%;right:20%;animation-delay:-15s;"></div>
  </div>

  <header class="site-header" id="top">
    <nav class="navbar" aria-label="Nawigacja projektu">
      <a class="brand" href="/"><span class="brand-name">GabeczkaG</span><span class="brand-accent">Web</span></a>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="/">Strona główna</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="project-page" id="projectPage">
      <div class="project-page-header">
        <img id="projImg" class="project-page-img" src="" alt="" hidden>
        <div class="project-page-meta">
          <h1 id="projName"></h1>
          <p id="projDesc" class="project-page-desc"></p>
          <a id="projLink" class="btn" href="#" target="_blank" rel="noopener">Zobacz na GitHub →</a>
        </div>
      </div>

      <section class="project-readme" id="readmeSection">
        <h2>Readme</h2>
        <div id="readme" class="project-readme"></div>
      </section>
    </section>

    <div id="loading" class="project-loading">Ładowanie projektu…</div>
    <div id="error" class="project-error" hidden></div>
  </main>

  <script>
    async function init() {
      const params = new URLSearchParams(location.search);
      let name = params.get("name");

      const pathMatch = location.pathname.match(/\/projectspage\/(.+)/);
      if (pathMatch && !name) {
        name = decodeURIComponent(pathMatch[1]);
        try { history.replaceState(null, "", `/projectspage.html?name=${encodeURIComponent(name)}`); } catch (e) {}
      }

      if (!name) {
        showError("Brak parametru ?name= w adresie.");
        return;
      }

      try {
        const r = await fetch("/projects.json", { cache: "no-store" });
        if (!r.ok) throw new Error("Nie udało się wczytać listy projektów.");
        const raw = await r.json();
        const projects = Array.isArray(raw) ? raw : (Array.isArray(raw.projects) ? raw.projects : []);
        const favorites = Array.isArray(raw.favorites) ? raw.favorites : [];
        const project = projects.find(p => p.name === name) || favorites.find(p => p.name === name);
        if (!project) throw new Error(`Projekt "${name}" nie został znaleziony.`);

        document.getElementById("projName").textContent = project.name;
        document.getElementById("projDesc").textContent = project.description || "";
        document.getElementById("projLink").href = project.url;

        const img = document.getElementById("projImg");
        if (project.image) {
          img.src = project.image;
          img.alt = project.name;
          img.hidden = false;
        } else {
          img.hidden = true;
        }

        const el = document.getElementById("readme");
        const renderReadme = async (project) => {
          const m = project.url.match(/github\.com\/([^\/]+)\/([^\/]+)/);
          if (!m) {
            el.innerHTML = "<p>Nie można pobrać README (nieprawidłowy URL repo).</p>";
            return;
          }
          const [, owner, repo] = m;

          try {
            const rr = await fetch(`https://api.github.com/repos/${owner}/${repo}/readme`, {
              headers: { Accept: "application/vnd.github.raw+json" }
            });
            if (!rr.ok) {
              el.innerHTML = "<p>Brak README dla tego repozytorium.</p>";
              return;
            }
            const text = await rr.text();

            if (typeof marked !== "undefined") {
              const html = marked.parse(text, {
                gfm: true,
                breaks: true,
                headerIds: false,
                mangle: false
              });
              el.innerHTML = html;
            } else {
              el.innerHTML = "<pre>" + text.replace(/[<>&"']/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;", "'": "&#39;" })[c] || c) + "</pre>";
            }
          } catch (e) {
            el.innerHTML = "<p>Nie udało się pobrać README.</p>";
          }
        };

        if (project.readmeHtml) {
          el.innerHTML = marked.parse(project.readmeHtml, { gfm: true, breaks: true, headerIds: false, mangle: false });
        } else {
          await renderReadme(project);
        }

        document.getElementById("loading").hidden = true;
      } catch (e) {
        showError(e.message);
      }
    }

    function showError(msg) {
      const el = document.getElementById("error");
      el.textContent = msg;
      el.hidden = false;
      document.getElementById("loading").hidden = true;
    }

    init();
  </script>
</body>
</html>
