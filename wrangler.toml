name = "gabeczkaweb-auth"
main = "src/worker.js"
compatibility_date = "2024-09-23"

[vars]
GITHUB_CLIENT_ID = "REPLACE_WITH_APP_CLIENT_ID"
INSTALLATION_ID = "REPLACE_WITH_INSTALLATION_ID"
WORKER_URL = "https://gabeczkaweb-auth.workers.dev"
SITE_ORIGIN = "https://gabeczkag.github.io"

# Wartości wrażliwe (secret) ustaw przez:
#   wrangler secret put GITHUB_APP_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
#   wrangler secret put GITHUB_PRIVATE_KEY   (klucz PKCS#8 PEM)
#   wrangler secret put SESSION_SECRET
