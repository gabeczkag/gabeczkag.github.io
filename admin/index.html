<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Panel administratora GabeczkaGWeb">
<title>Admin — GabeczkaGWeb</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="navbar" aria-label="Nawigacja panelu">
    <a class="brand" href="/">GabeczkaG<span class="brand-accent">Web</span> <span class="brand-tag">admin</span></a>
  </nav>
</header>

<main class="admin">
  <section class="admin-auth" id="auth">
    <h2>Logowanie</h2>
    <p>Zaloguj się przez GitHub, by edytować projekty. Dostęp mają tylko właściciele konta <code>gabeczkag</code>.</p>
    <div class="admin-form">
      <button class="btn" id="login">Zaloguj przez GitHub</button>
    </div>
    <p class="admin-warn" id="authmsg"></p>
  </section>

  <section class="admin-panel" id="panel" hidden>
    <div class="section-head">
      <h2>Projekty</h2>
      <span class="projects-count" id="cnt"></span>
    </div>
    <ul class="admin-list" id="list"></ul>

    <h3>Dodaj / edytuj projekt</h3>
    <form class="admin-edit" id="edit">
      <input type="hidden" id="idx">
      <label>Nazwa<input id="name" required placeholder="Np. Moja Aplikacja"></label>
      <label>URL<input id="url" type="url" required placeholder="https://github.com/gabeczkag/..."></label>
      <label style="grid-column:1 / -1">Opis<textarea id="desc" rows="3" placeholder="Krótki opis projektu"></textarea></label>
      <div class="admin-actions">
        <button type="submit" class="btn">Zapisz</button>
        <button type="button" class="btn btn-ghost" id="cancel">Anuluj</button>
      </div>
    </form>

    <div class="admin-save">
      <button class="btn" id="save">Zapisz do GitHub</button>
      <button class="btn btn-ghost" id="logout">Wyloguj</button>
      <span id="status"></span>
    </div>

    <p style="margin-top:1.5rem"><a href="/">← powrót do strony</a></p>
  </section>
</main>

<script src="/assets/js/admin.js" defer></script>
</body>
</html>
