<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xKiro Scanner — Connect</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #14101c; color: #f3ecff; margin: 0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wrap { text-align: center; max-width: 420px; }
  h1 { font-size: 1.3rem; margin-bottom: 8px; }
  p { color: #b9a8d9; font-size: .9rem; }
  #connectBtn { margin-top: 20px; padding: 14px 34px; border-radius: 12px; border: 0; cursor: pointer;
    font-size: 1rem; font-weight: 800; background: linear-gradient(135deg, #ff7e5f, #ff9a4d); color: #1a0f00; }
  dialog { background: #1f1830; color: #f3ecff; border: 1px solid #3a2d5c; border-radius: 14px;
    padding: 24px; width: min(400px, 90vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog input, dialog select { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px;
    border: 1px solid #3a2d5c; background: #120e1c; color: #fff; box-sizing: border-box; }
  dialog label { display: block; margin-top: 12px; font-size: .85rem; text-align: left; }
  dialog .row { display: flex; gap: 10px; margin-top: 18px; }
  dialog .row button { flex: 1; padding: 11px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 700; }
  #okBtn { background: linear-gradient(135deg, #ff7e5f, #ff9a4d); color: #1a0f00; }
  #cancelBtn { background: #2c2344; color: #f3ecff; }
  #dlgStatus { min-height: 1.5em; margin-top: 12px; font-size: .88rem; }
  .ok { color: #7dffb2; } .err { color: #ff8f8f; }
  code { background: #120e1c; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
  a { color: #ffb88c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔌 xKiro Scanner</h1>
  <p id="sub">Podłącz repo do xKiro jednym klikiem.</p>
  <button id="connectBtn">Connect xKiro</button>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">Connect xKiro</h3>
  <div id="stepKey">
    <label>API KEY (xKiro)</label>
    <input id="key" type="password" autocomplete="off" placeholder="xkiro_...">
  </div>
  <div id="stepRepo" hidden>
    <label>Repo</label>
    <select id="repoSel"></select>
    <label>Nazwa (wejdzie w nazwę secreta)</label>
    <input id="name" placeholder="prod" maxlength="32">
  </div>
  <div id="dlgStatus"></div>
  <div class="row">
    <button id="cancelBtn">Anuluj</button>
    <button id="okBtn">Dalej</button>
  </div>
</dialog>

<script>
// prod: podmień na adres bota z Railway, np. https://twoj-projekt.up.railway.app
const API = localStorage.getItem('xkiro_api') || 'http://localhost:3000';
const APP_INSTALL_URL = 'https://github.com/apps/xkiro-secret-scanner/installations/new';
const q = new URLSearchParams(location.search);
const installationId = q.get('installation_id');

const dlg = document.getElementById('dlg');
const st = document.getElementById('dlgStatus');
let phase = 'key'; // key -> repo -> done

if (q.get('setup_action') === 'install' && installationId) {
  document.getElementById('sub').textContent = 'App zainstalowana ✅ — kliknij Connect xKiro.';
}

document.getElementById('connectBtn').onclick = () => {
  if (!installationId) {
    st.innerHTML = 'Najpierw <a href="' + APP_INSTALL_URL + '">zainstaluj App</a> — wrócisz tu z potwierdzeniem.';
  } else {
    phase = 'key';
    document.getElementById('stepKey').hidden = false;
    document.getElementById('stepRepo').hidden = true;
    document.getElementById('okBtn').textContent = 'Dalej';
    st.textContent = '';
  }
  document.getElementById('key').value = '';
  dlg.showModal();
};
document.getElementById('cancelBtn').onclick = () => dlg.close();

document.getElementById('okBtn').onclick = async () => {
  const btn = document.getElementById('okBtn');
  btn.disabled = true;
  try {
    if (phase === 'key') {
      // Etap 1: /check/{id} - weryfikacja klucza
      st.textContent = 'Sprawdzam klucz...';
      const r = await fetch(API + '/xkiro/check/' + installationId, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ xkiroKey: document.getElementById('key').value }),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Błąd');
      if (!d.repos || d.repos.length === 0) throw new Error('Instalacja nie obejmuje żadnego repo');
      const sel = document.getElementById('repoSel');
      sel.innerHTML = d.repos.map((x) => '<option>' + x + '</option>').join('');
      document.getElementById('stepKey').hidden = true;
      document.getElementById('stepRepo').hidden = false;
      document.getElementById('okBtn').textContent = 'Zapisz';
      st.textContent = '';
      phase = 'repo';
    } else if (phase === 'repo') {
      // Etap 2: /add/ - zapis secreta w backendzie
      st.textContent = 'Zapisuję...';
      const r = await fetch(API + '/xkiro/add/' + installationId, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          xkiroKey: document.getElementById('key').value,
          repo: document.getElementById('repoSel').value,
          name: document.getElementById('name').value || 'default',
        }),
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Błąd');
      document.getElementById('stepRepo').hidden = true;
      document.getElementById('okBtn').textContent = 'Zamknij';
      st.innerHTML = '<span class="ok">✅ Gotowe! Secret <code>' + d.secretName + '</code></span>';
      phase = 'done';
    } else {
      dlg.close();
    }
  } catch (e) {
    st.innerHTML = '<span class="err">❌ ' + e.message + '</span>';
  } finally {
    if (phase !== 'done') document.getElementById('key').value = '';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
